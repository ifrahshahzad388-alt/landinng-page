<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">ICONIS FASHION</div>

        <ul class="nav-links">
          <div class="border-1" > <li><a href="#">New Arrivals</a></li></div>
          <div class="border-2">  <li><a href="#">Clothing</a></li></div>
           <div class="border-3"> <li><a href="#">Sale</a></li></div>
        </ul>

        <div class="cart-icon"> Cart (0)</div>
    </nav>

    <!-- Hero Section -->
    <header class="hero">
        <div class="hero-content">
            <h1>SUMMER '26</h1>
            <p>Elevated basics for the modern individual.</p>
            <a href="#" class="collection-btn">View Collection</a>
        </div>
    </header>

    <!-- Products -->
    <section class="products">
        <h2 class="section-title">Featured Products</h2>

        <div class="product-grid">

            <!-- Product 1 -->
            <div class="product-card">
                <img src="download.jpg" alt="Product 1">
                <h3>Classic Shirt</h3>
                <p class="price">Rs 3500</p>
            </div>

            <!-- Product 2 -->
            <div class="product-card">
                <img src="download (1).jpg" alt="Product 2">
                <h3>Modern Dress</h3>
                <p class="price">Rs 4200</p>
            </div>

        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2026 Fashion Store | All Rights Reserved</p>
        
    </footer>

</body>
</html>
